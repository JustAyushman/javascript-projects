<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Colors</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1 id="header">Hello</h1>
    </header>
     <main class="page">
    <div class="container">
        
            <div class="color-boxes">
                <div class="box" id="red" data-color="#ff4757">Red</div>
                <div class="box" id="blue" data-color="#2e86de">Blue</div>
                <div class="box" id="green" data-color="#2ed573">Green</div>
                <div class="box" id="yellow" data-color="#ffa502">Yellow</div>
            </div>

            <div class="controls">
                <input type="text" id="nameInput" placeholder="Enter your name">
                <button id="greetBtn">Greet</button>
            </div>
        
    </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
